# Railway deployment config for Atlas backend
# Docs: https://docs.railway.app/reference/config-as-code

[build]
# Railway uses the Dockerfile in the /backend directory
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "/bin/sh -c 'uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
